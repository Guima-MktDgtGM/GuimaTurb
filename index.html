:root{--blue:#2563eb;--bd:#e5e7eb;--txt:#111827;--mut:#6b7280;--bg:#f5f6f8}

button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--txt)}

header{position:fixed;top:0;left:0;right:0;height:60px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 22px;gap:14px;z-index:50}

.grow{flex:1}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer}

.nav a:hover{background:#f3f4f6}
.nav a.on{background:#eff6ff;color:var(--blue);font-weight:600}
.nav a.on svg{fill:var(--blue)}
main{margin:60px 0 0 236px;padding:28px 30px 60px;min-height:calc(100vh - 60px)}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:13px;margin-top:3px}
.row{display:flex;align-items:center;gap:12px}

.btn.dg{background:#fff;color:#dc2626;border:1px solid #fecaca}

.btn.sm{padding:7px 12px;font-size:12.5px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);padding:0 8px;background:#fff}

.tg{position:relative;width:40px;height:23px;flex:none;cursor:pointer}
.tg input{opacity:0;width:0;height:0;position:absolute}
.tg i{position:absolute;inset:0;background:#d1d5db;border-radius:999px;transition:.2s}

.tg input:checked+i{background:var(--blue)}

/* dropzone */
.dz{border:2px dashed #d1d5db;border-radius:12px;padding:32px 20px;text-align:center;cursor:pointer;transition:.15s;background:#fafbfc}
.dz.hot{border-color:var(--blue);background:#eff6ff}

.dev{display:inline-flex;background:#f3f4f6;border-radius:9px;padding:3px;margin-bottom:14px}

.frame{margin:0 auto;background:#000;border-radius:10px;overflow:hidden;transition:width .2s}
.frame iframe{display:block;width:100%;height:100%;border:0}
.code{background:#0f1117;color:#93c5fd;border-radius:10px;padding:14px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;line-height:1.65;white-space:pre-wrap;word-break:break-all;max-height:230px;overflow:auto;border:1px solid #1f2937}

.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat div{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px 16px}

.ret{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#111827;color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:500;opacity:0;transition:.25s;z-index:200}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1100px){.edit{grid-template-columns:1fr}.preview{position:static}}
@media(max-width:760px){aside{display:none}main{margin-left:0;padding:20px 14px}.stat{grid-template-columns:1fr 1fr}}
</style>

var AUTH_KEY = "gt_auth_creds", SESSION_KEY = "gt_auth_session";

  } catch(e) {

function isAuth() {
  try {
    return sessionStorage.getItem(SESSION_KEY) === "1" || localStorage.getItem(SESSION_KEY) === "1";
  } catch(e) {

  }
}

function setAuthSession(remember) {
  try {
    sessionStorage.setItem(SESSION_KEY, "1");

function clearAuthSession() {

/* ============ upload ============ */
function upload(){
  var file=null;
  modal("Novo vídeo",
   '<div class="dz" id="dz"><svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg><b>Arraste seu MP4 aqui</b><small>ou clique para escolher — fica salvo neste navegador</small><input type="file" id="fi" accept="video/*" hidden></div>'+
   '<div class="or">ou use uma URL</div>'+
   '<label class="f"><span>URL do vídeo (MP4 / CDN)</span><input class="inp" id="u_src" placeholder="https://cdn.exemplo.com/vsl.mp4"></label>'+
   '<label class="f"><span>Nome do vídeo</span><input class="inp" id="u_name" placeholder="VSL Principal"></label>'+
   '<label class="f"><span>Capa / thumbnail (opcional)</span><input class="inp" id="u_poster" placeholder="https://.../capa.jpg"></label>'+
   '<div class="note">Arquivo local funciona pra testar no seu navegador. Para publicar o embed, hospede o MP4 (Bunny CDN, Cloudflare R2) e cole a URL.</div>',
   "Salvar vídeo",function(close){
     var name=val("u_name"),src=val("u_src").trim(),poster=val("u_poster").trim();
     if(!file&&!src)return toast("Escolha um arquivo ou informe a URL");
     var v={id:uid(),name:name||(file?file.name.replace(/\.[^.]+$/,""):"Novo vídeo"),src:src,poster:poster,thumb:poster,created:Date.now(),del:0,cfg:Object.assign({},DEF,{accent:DB.cfg.accent,barColor:DB.cfg.accent,ctaColor:DB.cfg.cta})};
     function done(){putV(v);close();toast("Vídeo salvo");render()}
     if(file){var key=uid();v.src="idb:"+key;grabThumb(file,function(t){if(t&&!v.thumb)v.thumb=t;idbPut(key,file,done)})}else done();
   });
  var dz=document.getElementById("dz"),fi=document.getElementById("fi");
  dz.onclick=function(){fi.click()};
  fi.onchange=function(){if(fi.files[0])pick(fi.files[0])};
  ["dragenter","dragover"].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.add("hot")})});
  ["dragleave","drop"].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.remove("hot")})});
  dz.addEventListener("drop",function(e){var f=e.dataTransfer.files[0];if(f)pick(f)});
  function pick(f){if(!/^video\//.test(f.type))return toast("Selecione um arquivo de vídeo");file=f;
    dz.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg><b>'+esc(f.name)+'</b><small>'+(f.size/1048576).toFixed(1)+' MB — pronto</small>';
    if(!val("u_name"))document.getElementById("u_name").value=f.name.replace(/\.[^.]+$/,"");}
}
function grabThumb(file,cb){
  try{var u=URL.createObjectURL(file),vd=document.createElement("video");vd.preload="metadata";vd.muted=true;vd.src=u;
    vd.onloadeddata=function(){vd.currentTime=Math.min(2,(vd.duration||3)/3)};
    vd.onseeked=function(){try{var c=document.createElement("canvas");c.width=320;c.height=Math.round(320*(vd.videoHeight/vd.videoWidth||.5625));
      c.getContext("2d").drawImage(vd,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.6))}catch(e){cb(null)}URL.revokeObjectURL(u)};
    vd.onerror=function(){cb(null)};setTimeout(function(){cb(null)},4000)}catch(e){cb(null)}
}

  document.getElementById("rl").onclick=refresh;
  app.querySelectorAll(".dev button").forEach(function(b){b.onclick=function(){device=b.dataset.d;render()}});
  refresh();
  function refresh(){
    var fr=document.getElementById("fr");if(!fr)return;
    if(device==="mobile"){fr.style.width="290px";fr.style.height="516px"}else{fr.style.width="100%";fr.style.height="";fr.style.aspectRatio="16/9"}
    if(device==="mobile")fr.style.aspectRatio="";
    clearTimeout(refresh._t);refresh._t=setTimeout(function(){document.getElementById("pv").src=playerURL(getV(editId),true)},280);
  }
}
/* helpers de campo */
function val(id){var e=document.getElementById(id);return e?e.value:""}
function txt(l,k,c,ph){return '<label class="f"><span>'+l+'</span><input class="inp" data-k="'+k+'" value="'+esc(c[k])+'" placeholder="'+esc(ph||"")+'"></label>'}
function num(l,k,c,mn,mx){return '<label class="f"><span>'+l+'</span><input class="inp" type="number" min="'+mn+'" max="'+mx+'" data-k="'+k+'" value="'+esc(c[k])+'"></label>'}
function color(l,k,c){return '<label class="f"><span>'+l+'</span><div class="clr"><input type="color" data-k="'+k+'" data-pair="a" value="'+esc(c[k])+'"><input type="text" data-k="'+k+'" data-pair="b" value="'+esc(c[k])+'"></div></label>'}
function sw(l,k,c){return '<div class="sw"><span>'+l+'</span><label class="tg"><input type="checkbox" data-k="'+k+'"'+(+c[k]?" checked":"")+'><i></i></label></div>'}
function sel(l,k,c,opts){return '<label class="f"><span>'+l+'</span><select class="inp" data-k="'+k+'">'+opts.map(function(o){return '<option value="'+o[0]+'"'+(String(c[k])===o[0]?" selected":"")+'>'+o[1]+'</option>'}).join("")+'</select></label>'}
function range(l,k,c,mn,mx,st){return '<label class="f"><span>'+l+' <b style="float:right;color:#2563eb">'+c[k]+'</b></span><input type="range" style="width:100%" min="'+mn+'" max="'+mx+'" step="'+st+'" data-k="'+k+'" value="'+esc(c[k])+'" oninput="this.parentNode.querySelector(\'b\').textContent=this.value"></label>'}

/* ============ modais ============ */
function modal(title,body,okText,onOk,wide){
  var r=document.getElementById("mroot");
  r.innerHTML='<div class="ov"><div class="modal'+(wide?" wide":"")+'"><div class="mh"><h3>'+title+'</h3><div class="grow"></div><button class="x">&times;</button></div><div class="mb">'+body+'</div>'+
   (okText?'<div class="mf"><button class="btn gh" data-c>Cancelar</button><button class="btn" id="ok">'+okText+'</button></div>':'<div class="mf"><button class="btn gh" data-c>Fechar</button></div>')+'</div></div>';
  function close(){r.innerHTML=""}
  r.querySelector(".x").onclick=close;
  r.querySelector("[data-c]").onclick=close;
  r.querySelector(".ov").onclick=function(e){if(e.target===this)close()};
  if(okText)document.getElementById("ok").onclick=function(){onOk(close)};
  return close;
}
function embed(v){
  var mode="rec",resp=true;
  modal("Código de incorporação",
   '<div class="sw" style="border:1px solid var(--bd);border-radius:10px;padding:10px 13px;margin-bottom:14px"><span>Vídeo responsivo (recomendado)</span><label class="tg"><input type="checkbox" id="e_resp" checked><i></i></label></div>'+
   '<div class="tabs" style="border:1px solid var(--bd);border-radius:10px;margin-bottom:12px;padding:0 4px">'+
   ['rec|Recomendado','js|JavaScript','iframe|iFrame'].map(function(t){var p=t.split("|");return '<button data-m="'+p[0]+'" class="'+(p[0]==="rec"?"on":"")+'">'+p[1]+'</button>'}).join("")+'</div>'+
   '<div class="code" id="e_code"></div>'+
   '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="e_copy" style="flex:1">Copiar código</button><button class="btn gh" id="e_open">Abrir player</button></div>'+
   '<label class="f" style="margin-top:16px"><span>Link direto</span><input class="inp" id="e_link" readonly></label>'+
   '<div class="note">Hospede os dois arquivos juntos (index.html + player.html). Se o MP4 for um arquivo local, o embed só roda neste navegador — publique o vídeo num CDN para valer em qualquer página.</div>',
   null,null,true);
  function draw(){document.getElementById("e_code").textContent=embedCode(v,mode,resp);document.getElementById("e_link").value=playerURL(v)}
  document.querySelectorAll("#mroot .tabs button").forEach(function(b){b.onclick=function(){mode=b.dataset.m;document.querySelectorAll("#mroot .tabs button").forEach(function(x){x.classList.toggle("on",x===b)});draw()}});
  document.getElementById("e_resp").onchange=function(){resp=this.checked;draw()};
  document.getElementById("e_copy").onclick=function(){copy(embedCode(v,mode,resp))};
  document.getElementById("e_open").onclick=function(){window.open(playerURL(v),"_blank")};
  draw();
}
function copy(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast("Copiado!")},fallback);else fallback();
  function fallback(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Copiado!")}catch(e){toast("Copie manualmente")}a.remove()}
}
function analytics(v){
  var s=DB.stats[v.id]||{plays:0,ret:{},cta:0};
  var pcts=[25,50,75,90,100],r=s.ret||{},plays=s.plays||0;
  modal("Analytics — "+esc(v.name),
   '<div class="stat" style="grid-template-columns:repeat(3,1fr)"><div><b>'+plays+'</b><span>Plays</span></div>'+
   '<div><b>'+(s.cta||0)+'</b><span>Cliques no CTA</span></div>'+
   '<div><b>'+(plays?Math.round(((r[50]||0)/plays)*100):0)+'%</b><span>Chegam aos 50%</span></div></div>'+
   '<div style="font-size:12.5px;font-weight:700;margin:6px 0 10px">Retenção</div>'+
   pcts.map(function(p){var pc=plays?Math.round(((r[p]||0)/plays)*100):0;return '<div class="ret"><i>'+p+'%</i><div><span style="width:'+pc+'%"></span></div><i style="width:44px;text-align:right;color:#111827">'+pc+'%</i></div>'}).join("")+
   '<div class="note">Os dados vêm do navegador de quem assistiu (localStorage). No mesmo domínio isso funciona para os seus testes; para métricas de tráfego real use o Pixel ou o evento postMessage na sua página.</div>',
   null,null);
}

/* ============ segurança ============ */
function seg(app){
  var g=DB.cfg;
  var currentAuth = getAuth();

  app.innerHTML='<h1>Segurança</h1><div class="sub" style="margin-bottom:20px">Gerencie o acesso ao painel e a proteção dos seus vídeos</div>'+
   
   '<div class="card" style="padding:22px;max-width:640px;margin-bottom:20px">'+
   '<h3 style="font-size:16px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px;"><svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:var(--blue)"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>Acesso ao Painel GuimaTurb</h3>'+
   '<div class="sub" style="margin-bottom:16px">Altere o usuário e a senha de login do painel administrativo.</div>'+
   '<label class="f"><span>Usuário / Login</span><input class="inp" id="adm_user" value="'+esc(currentAuth.user)+'" placeholder="admin"></label>'+
   '<div class="two">'+
     '<label class="f"><span>Nova Senha</span><input class="inp" id="adm_pass1" type="password" placeholder="Nova senha"></label>'+
     '<label class="f"><span>Confirmar Nova Senha</span><input class="inp" id="adm_pass2" type="password" placeholder="Repita a senha"></label>'+
   '</div>'+
   '<button class="btn" id="adm_save_creds">Atualizar Credenciais</button></div>'+

   '<div class="card" style="padding:22px;max-width:640px">'+
   '<h3 style="font-size:16px;font-weight:700;margin-bottom:6px">Trava de Domínios do Player</h3>'+
   '<div class="sub" style="margin-bottom:14px">Proteja seus vídeos de serem inseridos em sites que não são seus.</div>'+
   '<label class="f"><span>Domínios autorizados<small>Um por linha. Vazio = liberado em qualquer site. localhost sempre permitido.</small></span><textarea class="inp" id="s_dom" placeholder="meusite.com.br\nvendas.meusite.com">'+esc(g.domains)+'</textarea></label>'+
   '<button class="btn" id="s_save">Salvar Domínios</button>'+
   '<div style="border-top:1px solid var(--bd);margin:20px 0 0;padding-top:16px">'+
   ['Menu do botão direito bloqueado no player','Download nativo desabilitado','Controles do navegador ocultos (sem barra padrão)','Vídeo servido em iframe isolado'].map(function(t){
     return '<div class="row" style="padding:7px 0;font-size:13px;color:#374151"><svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:#16a34a"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>'+t+'</div>'}).join("")+'</div>'+
   '<div class="note">A trava de domínio impede o embed em sites de terceiros.</div></div>';

  document.getElementById("adm_save_creds").onclick=function(){
    var u = val("adm_user").trim();
    var p1 = val("adm_pass1").trim();
    var p2 = val("adm_pass2").trim();
    if (!u) return toast("Informe um nome de usuário");
    if (p1 || p2) {
      if (p1.length < 6) return toast("A senha deve ter pelo menos 6 caracteres");
      if (p1 !== p2) return toast("As senhas não coincidem!");
      saveAuth(u, p1);
    } else {
      var cur = getAuth();
      saveAuth(u, cur.pass);
    }
    toast("Credenciais atualizadas com sucesso!");
    document.getElementById("adm_pass1").value = "";
    document.getElementById("adm_pass2").value = "";
  };

  document.getElementById("s_save").onclick=function(){var c=DB.cfg;c.domains=val("s_dom").trim();DB.cfg=c;toast("Segurança atualizada")};
}
/* ============ configurações ============ */
function cfgpage(app){
  var g=DB.cfg;
  app.innerHTML='<h1>Configurações</h1><div class="sub" style="margin-bottom:20px">Preferências da sua conta</div>'+
   '<div class="card" style="padding:20px;max-width:640px">'+
   '<div class="two"><label class="f"><span>Nome da marca</span><input class="inp" id="c_brand" value="'+esc(g.brand)+'"></label>'+
   '<label class="f"><span>Iniciais do avatar</span><input class="inp" id="c_ini" maxlength="2" value="'+esc(g.initials)+'"></label></div>'+
   '<div class="two"><label class="f"><span>Cor padrão do player</span><div class="clr"><input type="color" id="c_ac" value="'+esc(g.accent)+'"><input type="text" id="c_ac2" value="'+esc(g.accent)+'"></div></label>'+
   '<label class="f"><span>Cor padrão do CTA</span><div class="clr"><input type="color" id="c_ct" value="'+esc(g.cta)+'"><input type="text" id="c_ct2" value="'+esc(g.cta)+'"></div></label></div>'+
   '<button class="btn" id="c_save">Salvar</button></div>'+
   '<div class="card" style="padding:20px;max-width:640px;margin-top:16px">'+
   '<div style="font-weight:700;margin-bottom:4px">Backup</div><div class="sub" style="margin-bottom:14px">Exporte suas configurações para outro navegador ou servidor.</div>'+
   '<div class="row"><button class="btn gh" id="c_exp">Exportar JSON</button><button class="btn gh" id="c_imp">Importar JSON</button><button class="btn dg" id="c_reset">Apagar tudo</button></div>'+
   '<input type="file" id="c_file" accept="application/json" hidden></div>';
  document.getElementById("c_ac").oninput=function(){document.getElementById("c_ac2").value=this.value};
  document.getElementById("c_ct").oninput=function(){document.getElementById("c_ct2").value=this.value};
  document.getElementById("c_save").onclick=function(){var c=DB.cfg;c.brand=val("c_brand")||"VSL Player";c.initials=(val("c_ini")||"JG").toUpperCase();c.accent=val("c_ac2");c.cta=val("c_ct2");DB.cfg=c;toast("Salvo");render()};
  document.getElementById("c_exp").onclick=function(){
    var data={videos:DB.videos,cfg:DB.cfg,stats:DB.stats};
    var b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});var a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download="vsl-player-backup.json";a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},2000);};
  document.getElementById("c_imp").onclick=function(){document.getElementById("c_file").click()};
  document.getElementById("c_file").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){try{var d=JSON.parse(r.result);if(d.videos)DB.videos=d.videos;if(d.cfg)DB.cfg=d.cfg;if(d.stats)save(SK,d.stats);toast("Importado");render()}catch(e){toast("JSON inválido")}};r.readAsText(f)};
  document.getElementById("c_reset").onclick=function(){if(!confirm("Apagar TODOS os vídeos e configurações?"))return;localStorage.removeItem(VK);localStorage.removeItem(CK);localStorage.removeItem(SK);toast("Tudo apagado");render()};
}
render();
</script>
